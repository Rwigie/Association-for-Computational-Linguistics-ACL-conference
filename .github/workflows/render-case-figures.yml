name: Render verified molecular case figures
on:
  push:
    branches: [naacl-revision]
    paths:
      - scripts/render_case_figures.py
      - latex/case_molecule_data.json
      - .github/workflows/render-case-figures.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: naacl-revision
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install molecule depiction dependencies
        run: python -m pip install --disable-pip-version-check rdkit reportlab svglib
      - name: Generate actual molecular structure PDFs
        run: python scripts/render_case_figures.py
      - name: Commit verified figure assets to the paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figs/cmoral_case_*.pdf
          if git diff --cached --quiet; then
            echo "Figures already up to date"
          else
            git commit -m "Render verified BPQ-style molecular case PDF"
            git push origin HEAD:naacl-revision
          fi
