name: Compile NAACL manuscript
on:
  push:
    branches: [naacl-revision]
    paths:
      - "latex/**"
      - "figs/cmoral_case_*.pdf"
      - "figs/cmoral_sor_grayblue_arrows.pdf"
      - "figs/cmoral_grpo_gdpo_tracks_crowns.pdf"
      - ".github/workflows/compile-naacl.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ACL LaTeX with bib and figures
        uses: xu-cheng/latex-action@v3
        env:
          TEXINPUTS: ".:latex//:"
          BIBINPUTS: ".:latex//:"
          BSTINPUTS: ".:latex//:"
        with:
          root_file: latex/acl_latex.tex
          work_in_root_file_dir: false
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error
      - name: Attach manuscript PDF and compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naacl-manuscript-compilation
          path: |
            **/acl_latex.pdf
            **/acl_latex.log
          if-no-files-found: warn
